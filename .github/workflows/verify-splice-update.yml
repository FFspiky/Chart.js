name: Verify splice update on Ubuntu
on:
  push:
    branches: [verify/splice-update-c63cb8d]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: c63cb8d6088562d45355fc1e6dc229eb09c448cb
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: xvfb-run --auto-servernum pnpm run test-ci
